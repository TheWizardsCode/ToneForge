<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToneForge Sound Editor Demo</title>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --text-dim: #8b949e;
        --accent: #58a6ff;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
        gap: 1rem;
      }
      header {
        text-align: center;
      }
      header h1 {
        color: var(--accent);
        margin: 0 0 0.25rem;
      }
      header p {
        color: var(--text-dim);
        margin: 0;
        font-size: 0.9rem;
      }
      .toolbar {
        display: flex;
        gap: 0.75rem;
        align-items: end;
        flex-wrap: wrap;
        justify-content: center;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        font-size: 0.8rem;
        color: var(--text-dim);
      }
      select,
      input,
      button {
        font: inherit;
        padding: 0.35rem 0.5rem;
        border-radius: 0.35rem;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
      }
      button {
        cursor: pointer;
        border-color: var(--accent);
      }
      #editor {
        width: min(680px, 100%);
      }
      pre {
        width: min(680px, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.75rem;
        font-size: 0.8rem;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ToneForge Sound Editor</h1>
      <p>Standalone reference demo — shape a single sound and export it</p>
    </header>

    <div class="toolbar">
      <label>
        Recipe
        <select id="recipe" data-testid="recipe-select"></select>
      </label>
      <label>
        Seed
        <input id="seed" data-testid="seed-input" type="number" value="42" min="0" step="1" />
      </label>
      <button id="load" data-testid="load-button" type="button">Load</button>
      <button id="export" data-testid="export-button" type="button">Export WAV</button>
      <button id="dispose" data-testid="dispose-button" type="button">Dispose</button>
    </div>

    <div id="editor" data-testid="editor-container"></div>
    <pre id="preset-out" data-testid="preset-output" aria-live="polite"></pre>

    <script type="module" src="./editor-demo.ts"></script>
  </body>
</html>
