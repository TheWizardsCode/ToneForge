# Tier 1 — Pure tones & blips (single oscillator, simple envelope)
# Short gem collection tick

version: "0.1"
meta:
  name: collect-gem-tick
  description: Short gem collection tick
  category: Collect
  tags:
    - casual
    - joy
    - collect
  duration: 0.082
  parameters:
    - name: frequency
      type: number
      min: 1200
      max: 2400
      unit: Hz
      default: 1980
    - name: attack
      type: number
      min: 0.001
      max: 0.02
      unit: s
      default: 0.002
    - name: decay
      type: number
      min: 0.03
      max: 0.12
      unit: s
      default: 0.06
nodes:
  osc:
    kind: oscillator
    params:
      type: triangle
      frequency: 1980
  env:
    kind: envelope
    params:
      attack: 0.002
      decay: 0.06
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [osc, env, out]
