# Tier 1 — Pure tones & blips (single oscillator, simple envelope)
# Bell-like tapped tone for rewards

version: "0.1"
meta:
  name: tone-bell-tap
  description: Bell-like tapped tone for rewards
  category: Collect
  tags:
    - casual
    - joy
    - collect
  duration: 0.323
  parameters:
    - name: frequency
      type: number
      min: 660
      max: 1480
      unit: Hz
      default: 990
    - name: attack
      type: number
      min: 0.001
      max: 0.02
      unit: s
      default: 0.003
    - name: decay
      type: number
      min: 0.18
      max: 0.45
      unit: s
      default: 0.3
nodes:
  osc:
    kind: oscillator
    params:
      type: sine
      frequency: 990
  env:
    kind: envelope
    params:
      attack: 0.003
      decay: 0.3
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [osc, env, out]
