# Tier 2 — Shaped events (envelope + pitch movement)
# Squishy press shape for button actuation — exponential pitch contour from 500 Hz to 250 Hz.

version: "0.1"
meta:
  name: ui-press-squish
  description: Squishy press shape for button actuation
  category: UI
  tags:
    - casual
    - fun
    - ui
  duration: 0.23
  parameters:
    - name: startFreq
      type: number
      min: 300
      max: 800
      unit: Hz
      default: 500
    - name: endFreq
      type: number
      min: 150
      max: 400
      unit: Hz
      default: 250
    - name: attack
      type: number
      min: 0.001
      max: 0.03
      unit: s
      default: 0.005
    - name: decay
      type: number
      min: 0.03
      max: 0.4
      unit: s
      default: 0.1
nodes:
  osc:
    kind: oscillator
    params:
      type: triangle
      frequency: 500
    automation:
      frequency:
        - kind: set
          time: 0
          value: 500
        - kind: exponentialRamp
          time: 0.08
          value: 250
  env:
    kind: envelope
    params:
      attack: 0.005
      decay: 0.1
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [osc, env, out]
