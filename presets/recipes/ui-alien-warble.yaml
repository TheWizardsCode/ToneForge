# Tier 3 — Textured & filtered (FM)
# Alien warbling tone: an fmPattern carrier at 500 Hz modulated at 600 Hz (index 6).

version: "0.1"
meta:
  name: ui-alien-warble
  description: Alien warbling tone
  category: UI
  tags:
    - casual
    - fun
    - ui
  duration: 0.43
  parameters:
    - name: carrierFreq
      type: number
      min: 250
      max: 900
      unit: Hz
      default: 500
    - name: modulatorFreq
      type: number
      min: 300
      max: 1080
      unit: Hz
      default: 600
    - name: modIndex
      type: number
      min: 1
      max: 12
      unit: ratio
      default: 6
    - name: attack
      type: number
      min: 0.001
      max: 0.03
      unit: s
      default: 0.01
    - name: decay
      type: number
      min: 0.09
      max: 0.39
      unit: s
      default: 0.3
nodes:
  fm:
    kind: fmPattern
    params:
      carrierFrequency: 500
      modulatorFrequency: 600
      modulationIndex: 6
    automation:
      modulatorFrequency:
        - kind: set
          time: 0
          value: 600
        - kind: linearRamp
          time: 0.31
          value: 1400
  env:
    kind: envelope
    params:
      attack: 0.01
      decay: 0.3
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [fm, env, out]
