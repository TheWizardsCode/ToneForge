# Tier 1 — Pure tones & blips (single oscillator, simple envelope)
# Downward-feeling cancel blip

version: "0.1"
meta:
  name: ui-cancel-blip
  description: Downward-feeling cancel blip
  category: UI
  tags:
    - casual
    - fun
    - ui
  duration: 0.073
  parameters:
    - name: frequency
      type: number
      min: 260
      max: 620
      unit: Hz
      default: 420
    - name: attack
      type: number
      min: 0.001
      max: 0.02
      unit: s
      default: 0.003
    - name: decay
      type: number
      min: 0.02
      max: 0.1
      unit: s
      default: 0.05
nodes:
  osc:
    kind: oscillator
    params:
      type: sine
      frequency: 420
  env:
    kind: envelope
    params:
      attack: 0.003
      decay: 0.05
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [osc, env, out]
