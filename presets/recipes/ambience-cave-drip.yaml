# Tier 6 — Ambience & loops (drone + resonant LFO)
# Cave drip ambience.

version: '0.1'
meta:
  name: ambience-cave-drip
  description: Cave drip ambience
  category: Ambience
  tags:
  - casual
  - fun
  - ambience
  duration: 1.7
  parameters:
  - name: droneFreq
    type: number
    min: 55
    max: 140
    unit: Hz
    default: 90
    overrides:
    - target: osc.frequency
  - name: noiseLevel
    type: number
    min: 0.05
    max: 0.35
    unit: amplitude
    default: 0.15
    overrides:
    - target: noise.level
  - name: dripRate
    type: number
    min: 1
    max: 6
    unit: Hz
    default: 3
    overrides:
    - target: filter.automation.frequency.0.rate
  - name: dripDepth
    type: number
    min: 200
    max: 700
    unit: Hz
    default: 400
    overrides:
    - target: filter.automation.frequency.0.depth
  - name: attack
    type: number
    min: 0.15
    max: 0.5
    unit: s
    default: 0.3
    overrides:
    - target: env.attack
  - name: release
    type: number
    min: 0.2
    max: 0.6
    unit: s
    default: 0.5
    overrides:
    - target: env.release
nodes:
  osc:
    kind: oscillator
    params:
      type: sine
      frequency: 90
  noise:
    kind: noise
    params:
      color: white
      level: 0.15
  filter:
    kind: biquadFilter
    params:
      type: bandpass
      frequency: 900
      Q: 3
    automation:
      frequency:
      - kind: lfo
        rate: 3
        depth: 400
        offset: 900
        start: 0
        end: 2.5
        step: 0.005
        wave: sine
  mix:
    kind: gain
    params:
      gain: 0.6
  env:
    kind: envelope
    params:
      attack: 0.3
      decay: 0.5
      sustain: 0.8
      release: 0.5
  out:
    kind: destination
routing:
- chain:
  - osc
  - mix
- chain:
  - noise
  - filter
  - mix
- chain:
  - mix
  - env
  - out
