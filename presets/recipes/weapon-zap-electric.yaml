# Tier 3 — Textured & filtered (FM)
# Electric weapon zap: an fmPattern carrier at 1200 Hz modulated at 300 Hz (index 8).

version: "0.1"
meta:
  name: weapon-zap-electric
  description: Electric weapon zap
  category: Weapon
  tags:
    - casual
    - fun
    - weapon
  duration: 0.226
  parameters:
    - name: carrierFreq
      type: number
      min: 600
      max: 2160
      unit: Hz
      default: 1200
    - name: modulatorFreq
      type: number
      min: 150
      max: 540
      unit: Hz
      default: 300
    - name: modIndex
      type: number
      min: 1
      max: 12
      unit: ratio
      default: 8
    - name: attack
      type: number
      min: 0.001
      max: 0.03
      unit: s
      default: 0.001
    - name: decay
      type: number
      min: 0.045
      max: 0.195
      unit: s
      default: 0.15
nodes:
  fm:
    kind: fmPattern
    params:
      carrierFrequency: 1200
      modulatorFrequency: 300
      modulationIndex: 8
  env:
    kind: envelope
    params:
      attack: 0.001
      decay: 0.15
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [fm, env, out]
