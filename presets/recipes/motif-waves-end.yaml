# Tier 4 — Melodic motifs (4-note figure)
# Wave-end leitmotif (relief then worry): a resolved C-major phrase (G-C-E)
# that tails into a raised-4th (F#) worry note. Casual/arcade, deterministic.

version: "0.1"
meta:
