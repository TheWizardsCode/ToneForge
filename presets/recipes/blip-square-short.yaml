# Tier 1 — Pure tones & blips (single oscillator, simple envelope)
# Short square-wave blip for retro feedback

version: "0.1"
meta:
  name: blip-square-short
  description: Short square-wave blip for retro feedback
  category: UI
  tags:
    - casual
    - fun
    - ui
  duration: 0.053
  parameters:
    - name: frequency
      type: number
      min: 220
      max: 660
      unit: Hz
      default: 440
    - name: attack
      type: number
      min: 0.001
      max: 0.02
      unit: s
      default: 0.003
    - name: decay
      type: number
      min: 0.015
      max: 0.09
      unit: s
      default: 0.03
nodes:
  osc:
    kind: oscillator
    params:
      type: square
      frequency: 440
  env:
    kind: envelope
    params:
      attack: 0.003
      decay: 0.03
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [osc, env, out]
