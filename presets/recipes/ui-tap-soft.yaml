# Tier 1 — Pure tones & blips (single oscillator, simple envelope)
# Soft tap for light UI interactions

version: "0.1"
meta:
  name: ui-tap-soft
  description: Soft tap for light UI interactions
  category: UI
  tags:
    - casual
    - joy
    - ui
  duration: 0.074
  parameters:
    - name: frequency
      type: number
      min: 180
      max: 460
      unit: Hz
      default: 300
    - name: attack
      type: number
      min: 0.001
      max: 0.02
      unit: s
      default: 0.004
    - name: decay
      type: number
      min: 0.02
      max: 0.1
      unit: s
      default: 0.05
nodes:
  osc:
    kind: oscillator
    params:
      type: triangle
      frequency: 300
  env:
    kind: envelope
    params:
      attack: 0.004
      decay: 0.05
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [osc, env, out]
