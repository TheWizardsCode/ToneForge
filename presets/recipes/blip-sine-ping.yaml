# Tracer recipe: blip-sine-ping
# Tier 1 — Pure tones & blips (single oscillator, simple envelope)
# A short, bright sine blip for casual UI confirmations.

version: "0.1"
meta:
  name: blip-sine-ping
  description: Short, bright sine blip for UI confirmations
  category: UI
  tags:
    - casual
    - fun
    - ui
  duration: 0.06
  parameters:
    - name: frequency
      type: number
      min: 600
      max: 1200
      unit: Hz
      default: 880
    - name: attack
      type: number
      min: 0.001
      max: 0.01
      unit: s
      default: 0.005
    - name: decay
      type: number
      min: 0.02
      max: 0.1
      unit: s
      default: 0.04
nodes:
  osc:
    kind: oscillator
    params:
      type: sine
      frequency: 880
  env:
    kind: envelope
    params:
      attack: 0.005
      decay: 0.04
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [osc, env, out]
