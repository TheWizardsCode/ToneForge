# Tier 6 — Ambience & loops (chirping tone + noise bed)
# Night crickets ambience.

version: '0.1'
meta:
  name: ambience-night-crickets
  description: Night crickets ambience
  category: Ambience
  tags:
  - casual
  - fun
  - ambience
  duration: 1.6
  parameters:
  - name: cricketRate
    type: number
    min: 6
    max: 22
    unit: Hz
    default: 14
    overrides:
    - target: osc.automation.frequency.0.rate
  - name: cricketDepth
    type: number
    min: 150
    max: 500
    unit: Hz
    default: 300
    overrides:
    - target: osc.automation.frequency.0.depth
  - name: noiseLevel
    type: number
    min: 0.05
    max: 0.3
    unit: amplitude
    default: 0.15
    overrides:
    - target: noise.level
  - name: filterFreq
    type: number
    min: 800
    max: 2200
    unit: Hz
    default: 1500
    overrides:
    - target: filter.frequency
  - name: attack
    type: number
    min: 0.1
    max: 0.4
    unit: s
    default: 0.25
    overrides:
    - target: env.attack
  - name: release
    type: number
    min: 0.2
    max: 0.6
    unit: s
    default: 0.5
    overrides:
    - target: env.release
nodes:
  osc:
    kind: oscillator
    params:
      type: sine
      frequency: 4200
    automation:
      frequency:
      - kind: lfo
        rate: 14
        depth: 300
        offset: 4200
        start: 0
        end: 2.5
        step: 0.004
        wave: sine
  noise:
    kind: noise
    params:
      color: pink
      level: 0.15
  filter:
    kind: biquadFilter
    params:
      type: lowpass
      frequency: 1500
      Q: 0.8
  mix:
    kind: gain
    params:
      gain: 0.55
  env:
    kind: envelope
    params:
      attack: 0.25
      decay: 0.5
      sustain: 0.8
      release: 0.5
  out:
    kind: destination
routing:
- chain:
  - osc
  - mix
- chain:
  - noise
  - filter
  - mix
- chain:
  - mix
  - env
  - out
