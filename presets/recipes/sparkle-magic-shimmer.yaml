# Tier 3 — Textured & filtered (FM)
# Magical shimmer sparkle: an fmPattern carrier at 1800 Hz modulated at 2600 Hz (index 3).

version: "0.1"
meta:
  name: sparkle-magic-shimmer
  description: Magical shimmer sparkle
  category: Magic
  tags:
    - casual
    - joy
    - sparkle
  duration: 0.425
  parameters:
    - name: carrierFreq
      type: number
      min: 900
      max: 3240
      unit: Hz
      default: 1800
    - name: modulatorFreq
      type: number
      min: 1300
      max: 4680
      unit: Hz
      default: 2600
    - name: modIndex
      type: number
      min: 1
      max: 12
      unit: ratio
      default: 3
    - name: attack
      type: number
      min: 0.001
      max: 0.03
      unit: s
      default: 0.005
    - name: decay
      type: number
      min: 0.09
      max: 0.39
      unit: s
      default: 0.3
nodes:
  fm:
    kind: fmPattern
    params:
      carrierFrequency: 1800
      modulatorFrequency: 2600
      modulationIndex: 3
  env:
    kind: envelope
    params:
      attack: 0.005
      decay: 0.3
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [fm, env, out]
