# Tier 3 — Textured & filtered (FM)
# Robotic FM beep: an fmPattern carrier at 440 Hz modulated at 880 Hz (index 5).

version: "0.1"
meta:
  name: ui-robot-beep
  description: Robotic FM beep
  category: UI
  tags:
    - casual
    - fun
    - ui
  duration: 0.188
  parameters:
    - name: carrierFreq
      type: number
      min: 220
      max: 792
      unit: Hz
      default: 440
    - name: modulatorFreq
      type: number
      min: 440
      max: 1584
      unit: Hz
      default: 880
    - name: modIndex
      type: number
      min: 1
      max: 12
      unit: ratio
      default: 5
    - name: attack
      type: number
      min: 0.001
      max: 0.03
      unit: s
      default: 0.002
    - name: decay
      type: number
      min: 0.036
      max: 0.156
      unit: s
      default: 0.12
nodes:
  fm:
    kind: fmPattern
    params:
      carrierFrequency: 440
      modulatorFrequency: 880
      modulationIndex: 5
  env:
    kind: envelope
    params:
      attack: 0.002
      decay: 0.12
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [fm, env, out]
