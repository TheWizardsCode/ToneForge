# Tier 3 — Textured & filtered (filtered noise)
# Grass rustle footstep: a pink-noise source shaped by a bandpass filter at 2500 Hz (Q=3).

version: "0.1"
meta:
  name: footstep-grass-rustle
  description: Grass rustle footstep
  category: Footstep
  tags:
    - casual
    - joy
    - footstep
  duration: 0.228
  parameters:
    - name: filterFreq
      type: number
      min: 1250
      max: 4500
      unit: Hz
      default: 2500
    - name: attack
      type: number
      min: 0.001
      max: 0.02
      unit: s
      default: 0.003
    - name: decay
      type: number
      min: 0.045
      max: 0.195
      unit: s
      default: 0.15
nodes:
  noise:
    kind: noise
    params:
      color: pink
      level: 1
  filter:
    kind: biquadFilter
    params:
      type: bandpass
      frequency: 2500
      Q: 3
  level:
    kind: gain
    params:
      gain: 0.62
  env:
    kind: envelope
    params:
      attack: 0.003
      decay: 0.15
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [noise, filter, level, env, out]
