# Tier 1 — Pure tones & blips (single oscillator, simple envelope)
# Toggle-on confirmation blip

version: "0.1"
meta:
  name: ui-toggle-on
  description: Toggle-on confirmation blip
  category: UI
  tags:
    - casual
    - fun
    - ui
  duration: 0.063
  parameters:
    - name: frequency
      type: number
      min: 400
      max: 950
      unit: Hz
      default: 660
    - name: attack
      type: number
      min: 0.001
      max: 0.02
      unit: s
      default: 0.003
    - name: decay
      type: number
      min: 0.02
      max: 0.09
      unit: s
      default: 0.04
nodes:
  osc:
    kind: oscillator
    params:
      type: square
      frequency: 660
  env:
    kind: envelope
    params:
      attack: 0.003
      decay: 0.04
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [osc, env, out]
