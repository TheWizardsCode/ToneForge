# Tier 2 — Shaped events (envelope + pitch movement)
# Bright rising pitch sweep for positive cues — linear pitch contour from 300 Hz to 1200 Hz.

version: "0.1"
meta:
  name: sweep-rise-bright
  description: Bright rising pitch sweep for positive cues
  category: UI
  tags:
    - casual
    - joy
    - sweep
  duration: 0.6
  parameters:
    - name: startFreq
      type: number
      min: 180
      max: 480
      unit: Hz
      default: 300
    - name: endFreq
      type: number
      min: 720
      max: 1920
      unit: Hz
      default: 1200
    - name: attack
      type: number
      min: 0.001
      max: 0.03
      unit: s
      default: 0.01
    - name: decay
      type: number
      min: 0.03
      max: 0.4
      unit: s
      default: 0.3
nodes:
  osc:
    kind: oscillator
    params:
      type: sine
      frequency: 300
    automation:
      frequency:
        - kind: set
          time: 0
          value: 300
        - kind: linearRamp
          time: 0.25
          value: 1200
  env:
    kind: envelope
    params:
      attack: 0.01
      decay: 0.3
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [osc, env, out]
