# Tier 3 — Textured & filtered (filtered noise)
# Gravel crunch impact: a brown-noise source shaped by a bandpass filter at 900 Hz (Q=4).

version: "0.1"
meta:
  name: impact-crunch-gravel
  description: Gravel crunch impact
  category: Impact
  tags:
    - casual
    - fun
    - impact
  duration: 0.266
  parameters:
    - name: filterFreq
      type: number
      min: 450
      max: 1620
      unit: Hz
      default: 900
    - name: attack
      type: number
      min: 0.001
      max: 0.02
      unit: s
      default: 0.002
    - name: decay
      type: number
      min: 0.054
      max: 0.234
      unit: s
      default: 0.18
nodes:
  noise:
    kind: noise
    params:
      color: brown
      level: 1
  filter:
    kind: biquadFilter
    params:
      type: bandpass
      frequency: 900
      Q: 4
  level:
    kind: gain
    params:
      gain: 0.62
  env:
    kind: envelope
    params:
      attack: 0.002
      decay: 0.18
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [noise, filter, level, env, out]
