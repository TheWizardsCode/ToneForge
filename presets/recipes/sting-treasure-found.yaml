# Tier 7 — Multi-voice stings
# Treasure-found sting (self-contained 2–3 voices, no stack required).

version: '0.1'
meta:
  name: sting-treasure-found
  description: Treasure-found sting
  category: Sting
  tags:
  - casual
  - joy
  - sting
  duration: 0.87
  parameters:
  - name: carrierFreq
    type: number
    min: 900
    max: 1500
    unit: Hz
    default: 1200
    overrides:
    - target: fm.carrierFrequency
  - name: modulatorFreq
    type: number
    min: 1400
    max: 2200
    unit: Hz
    default: 1800
    overrides:
    - target: fm.modulatorFrequency
  - name: modIndex
    type: number
    min: 2
    max: 8
    unit: ratio
    default: 3
    overrides:
    - target: fm.modulationIndex
  - name: bassFreq
    type: number
    min: 200
    max: 340
    unit: Hz
    default: 262
    overrides:
    - target: bass.frequency
  - name: noiseLevel
    type: number
    min: 0.05
    max: 0.3
    unit: amplitude
    default: 0.15
    overrides:
    - target: noise.level
  - name: attack
    type: number
    min: 0.003
    max: 0.02
    unit: s
    default: 0.006
    overrides:
    - target: env.attack
  - name: decay
    type: number
    min: 0.25
    max: 0.65
    unit: s
    default: 0.5
    overrides:
    - target: env.decay
nodes:
  fm:
    kind: fmPattern
    params:
      carrierFrequency: 1200
      modulatorFrequency: 1800
      modulationIndex: 3
  bass:
    kind: oscillator
    params:
      type: triangle
      frequency: 262
  noise:
    kind: noise
    params:
      color: white
      level: 0.15
  mix:
    kind: gain
    params:
      gain: 0.32
  env:
    kind: envelope
    params:
      attack: 0.006
      decay: 0.5
      sustain: 0.0
      release: 0.0
  out:
    kind: destination
routing:
- chain:
  - fm
  - mix
- chain:
  - bass
  - mix
- chain:
  - noise
  - mix
- chain:
  - mix
  - env
  - out
