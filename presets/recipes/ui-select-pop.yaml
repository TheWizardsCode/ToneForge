# Tier 1 — Pure tones & blips (single oscillator, simple envelope)
# Pop-like selection tone

version: "0.1"
meta:
  name: ui-select-pop
  description: Pop-like selection tone
  category: UI
  tags:
    - casual
    - fun
    - ui
  duration: 0.067
  parameters:
    - name: frequency
      type: number
      min: 300
      max: 760
      unit: Hz
      default: 520
    - name: attack
      type: number
      min: 0.001
      max: 0.02
      unit: s
      default: 0.002
    - name: decay
      type: number
      min: 0.02
      max: 0.09
      unit: s
      default: 0.045
nodes:
  osc:
    kind: oscillator
    params:
      type: square
      frequency: 520
  env:
    kind: envelope
    params:
      attack: 0.002
      decay: 0.045
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [osc, env, out]
