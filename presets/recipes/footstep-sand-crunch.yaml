# Tier 3 — Textured & filtered (filtered noise)
# Sand crunch footstep: a white-noise source shaped by a bandpass filter at 1400 Hz (Q=5).

version: "0.1"
meta:
  name: footstep-sand-crunch
  description: Sand crunch footstep
  category: Footstep
  tags:
    - casual
    - joy
    - footstep
  duration: 0.188
  parameters:
    - name: filterFreq
      type: number
      min: 700
      max: 2520
      unit: Hz
      default: 1400
    - name: attack
      type: number
      min: 0.001
      max: 0.02
      unit: s
      default: 0.002
    - name: decay
      type: number
      min: 0.036
      max: 0.156
      unit: s
      default: 0.12
nodes:
  noise:
    kind: noise
    params:
      color: white
      level: 1
  filter:
    kind: biquadFilter
    params:
      type: bandpass
      frequency: 1400
      Q: 5
  level:
    kind: gain
    params:
      gain: 0.62
  env:
    kind: envelope
    params:
      attack: 0.002
      decay: 0.12
      sustain: 0
      release: 0
  out:
    kind: destination
routing:
  - chain: [noise, filter, level, env, out]
